info:
  name: Create Property
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/properties"
  body:
    type: json
    data: |-
      {
        "title": "BullMQ Test Villa",
        "description": "Это тестовое описание, которое специально сделано длиннее двадцати символов, чтобы Zod валидатор пропустил запрос.",
        "type": "HOUSE",
        "city": "Kyiv",
        "address": "123 Async Worker Street",
        "pricePerNight": 150,
        "maxGuests": 4,
        "amenities": [
          "WIFI",
          "AIR_CONDITIONING",
          "PARKING"
        ],
        "rawImagePaths": [
          "/tmp/fake_upload_1.jpg",
          "/tmp/fake_upload_2.jpg",
          "/tmp/fake_upload_3.png"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (res.status === 201 && data?.id) {
          bru.setEnvVar("propertyId", data.id);
          bru.setEnvVar("testProperty", data.id);
          bru.setVar("propertyId", data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
