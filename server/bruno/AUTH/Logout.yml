info:
  name: Logout
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("jwt_token", ""); 
          bru.setEnvVar("bookingId", "");
          bru.setEnvVar("paymentId", "");
          bru.setEnvVar("reviewId", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
