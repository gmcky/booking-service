info:
  name: Property Reviews
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/reviews/property/{{propertyId}}"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: sort
      value: recent
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
