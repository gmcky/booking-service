info:
  name: Property Reviews
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/reviews/property/{{propertyId}}?page=1&limit=10&sort=recent"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sort
      value: recent
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
