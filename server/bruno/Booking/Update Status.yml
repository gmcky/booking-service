info:
  name: Update Status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/bookings/{{bookingId}}/status"
  body:
    type: json
    data: |-
      {
        "status": "CONFIRMED"
      }
  auth: inherit

runtime:
  variables:
    - name: bookingId
      value: cc1ee44e-098e-42f3-8627-a8cff8f30ca3

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
