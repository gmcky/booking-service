info:
  name: Update Status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/bookings/{{bookingId}}/status"
  body:
    type: json
    data: |-
      {
        "status": "CONFIRMED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
