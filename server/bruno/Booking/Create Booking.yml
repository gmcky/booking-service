info:
  name: Create Booking
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/bookings"
  body:
    type: json
    data: |-
      {
        "propertyId": "{{propertyId}}",
        "checkIn": "2026-06-18T14:00:00.000Z",
        "checkOut": "2026-06-23T12:00:00.000Z",
        "guests": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
