info:
  name: Payment By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/payments/{{paymentId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (res.status === 200 && data?.id) {
          bru.setEnvVar("paymentId", data.id);
          bru.setVar("paymentId", data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
