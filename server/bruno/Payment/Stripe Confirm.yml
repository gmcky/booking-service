info:
  name: Stripe Confirm
  type: http
  seq: 2

http:
  method: POST
  url: https://api.stripe.com/v1/payment_intents/{{intentId}}/confirm
  body:
    type: form-urlencoded
    data:
      - name: payment_method
        value: pm_card_visa
      - name: return_url
        value: http://localhost:3000
  auth:
    type: bearer
    token: "{{sk_test}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
