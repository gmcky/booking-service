info:
  name: Payment Intent
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/payments/intent"
  body:
    type: json
    data: |-
      {
        "bookingId": "{{bookingId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (data.clientSecret) {
          const intentId = data.clientSecret.split('_secret_')[0];
          
          bru.setVar("intentId", intentId);
          console.log("Saved pure intentId:", intentId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
