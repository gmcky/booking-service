# Production docker-compose
services:
  app:
    image: ghcr.io/gmcky/booking-service-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - booking-network
      - proxy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  workers:
    image: ghcr.io/gmcky/booking-service-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-workers
    command: ["node", "dist/workers/index.js"]
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    networks:
      - booking-network
    restart: unless-stopped
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - booking-network

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    entrypoint: ["/usr/local/bin/redis-entrypoint.sh"]
    volumes:
      - redis_data:/data
      - ./docker/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -u redis://booking:$$REDIS_PASSWORD@localhost:6379 ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - booking-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  booking-network:
    driver: bridge
  proxy:
    external: true
